name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python reference runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Lint Python
        run: uv run ruff check src scripts tests

      - name: Check Python formatting
        run: uv run ruff format --check src scripts tests

      - name: Run tests with coverage gate
        run: >-
          uv run pytest
          --cov=bim_review_agent
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Build source and wheel distributions
        run: uv build

  sites:
    name: Sites Worker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/gpt-sites/package-lock.json

      - name: Install locked Sites dependencies
        working-directory: apps/gpt-sites
        run: npm ci

      - name: Type-check Sites runtime
        working-directory: apps/gpt-sites
        run: npm run typecheck

      - name: Lint Sites runtime
        working-directory: apps/gpt-sites
        run: npm run lint

      - name: Build and run Sites regression gates
        working-directory: apps/gpt-sites
        run: npm test
